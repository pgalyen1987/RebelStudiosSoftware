<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<!-- blog-bulk-print-woocommerce-invoices: tick orders on the list, one bulk action, one PDF with a page per order. -->
<style>
  .wrap{position:absolute;inset:44px 54px}
  h1{font:600 32px/1.2 'Space Grotesk',sans-serif;max-width:1040px}
  .stage{margin-top:30px;display:grid;grid-template-columns:1fr 96px 300px;align-items:center;gap:0}
  .list{background:var(--raise);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
  .list .bar{justify-content:space-between}
  .row{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--line);font:500 15px Inter,sans-serif;color:var(--ink2)}
  .row:last-child{border-bottom:0}
  .cb{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font:700 12px Inter;color:#07090f}
  .cb.on{background:var(--green2);border-color:var(--green2)}
  .row .id{font-family:'JetBrains Mono',monospace;color:var(--ink1);width:78px}
  .row .who{flex:1}
  .row .amt{font-family:'JetBrains Mono',monospace;color:var(--ink3)}
  .pill{margin:14px 16px 16px;display:inline-flex;align-items:center;gap:9px;background:var(--greenbg);border:1px solid var(--green);border-radius:8px;padding:9px 14px;font:600 14px 'JetBrains Mono',monospace;color:var(--green2)}
  .pill .car{color:var(--ink3);font-weight:400}
  .arrow{display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:40px}
  .doc{position:relative;height:220px}
  .page{position:absolute;background:#f7f7f4;border-radius:8px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
  .p1{inset:0 40px 40px 0;z-index:1}
  .p2{inset:14px 26px 26px 14px;z-index:2}
  .p3{inset:28px 12px 12px 28px;z-index:3;padding:20px 22px}
  .p3 .h{font:700 16px 'Space Grotesk',sans-serif;color:#20242d}
  .p3 .sub{font:500 12px 'JetBrains Mono',monospace;color:#6b7280;margin-top:2px}
  .p3 .ln{height:8px;border-radius:3px;background:#e3e5ea;margin-top:12px}
  .p3 .ln.s{width:60%}.p3 .ln.m{width:82%}
  .cap{margin-top:14px;text-align:center;font:500 14px Inter,sans-serif;color:var(--ink2)}
  .cap b{color:var(--green2)}
</style>
<div class="wrap">
  <h1>Tick the orders. One bulk action. One PDF, a page per order.</h1>
  <div class="stage">
    <div class="list">
      <div class="bar"><span>WooCommerce &rsaquo; Orders</span><span style="color:var(--green2)">4 selected</span></div>
      <div class="row"><span class="cb on">&check;</span><span class="id">#1042</span><span class="who">Amara O.</span><span class="amt">$58.00</span></div>
      <div class="row"><span class="cb on">&check;</span><span class="id">#1043</span><span class="who">Deepak R.</span><span class="amt">$129.90</span></div>
      <div class="row"><span class="cb on">&check;</span><span class="id">#1044</span><span class="who">Lena M.</span><span class="amt">$24.00</span></div>
      <div class="row"><span class="cb on">&check;</span><span class="id">#1045</span><span class="who">Tomás V.</span><span class="amt">$317.50</span></div>
      <div class="pill">Print invoices (PDF) <span class="car">&#9662;</span></div>
    </div>
    <div class="arrow">&rarr;</div>
    <div>
      <div class="doc">
        <div class="page p1"></div>
        <div class="page p2"></div>
        <div class="page p3">
          <div class="h">Invoice #1042</div>
          <div class="sub">orders.pdf &middot; 4 pages</div>
          <div class="ln m"></div><div class="ln s"></div><div class="ln m"></div>
        </div>
      </div>
      <div class="cap"><b>One file.</b> Not four print dialogs.</div>
    </div>
  </div>
</div>
<div class="credit">rebelstudiossoftware.com</div>
