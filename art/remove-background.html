<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<!-- blog-remove-background: a real cutout of a real photo (art/assets/mug-cut.png, made from mug.jpg
     by keying the backdrop colour, clearing the enclosed gap in the handle and shaving the fringe). -->
<style>
  .half{position:absolute;top:0;bottom:0;width:600px;overflow:hidden}
  .l{left:0}.r{left:600px;background-color:#e7ebf0;background-image:linear-gradient(45deg,#d3d9e1 25%,transparent 25%,transparent 75%,#d3d9e1 75%),linear-gradient(45deg,#d3d9e1 25%,transparent 25%,transparent 75%,#d3d9e1 75%);background-size:36px 36px;background-position:0 0,18px 18px}
  .l img{width:100%;height:100%;object-fit:cover;object-position:52% 55%}
  .r img{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:420px;filter:drop-shadow(0 18px 18px rgba(0,0,0,.18))}
  .tag{position:absolute;top:24px;font:600 15px 'JetBrains Mono',monospace;padding:7px 12px;border-radius:8px;background:rgba(7,9,15,.78);color:var(--ink1)}
  .l .tag{left:24px}.r .tag{left:24px}
  .note{position:absolute;left:24px;right:24px;bottom:22px;font:500 15px/1.45 Inter,sans-serif;color:#1b2130}
  .note b{font-weight:600}
  .credit{left:16px;right:auto;color:rgba(255,255,255,.85)}
  .divider{position:absolute;left:599px;top:0;bottom:0;width:2px;background:#07090f}
</style>
<div class="half l"><img src="assets/mug.jpg" alt=""><span class="tag">original</span><span class="credit">Photo: Jievani / Pexels</span></div>
<div class="divider"></div>
<div class="half r"><img src="assets/mug-cut.png" alt=""><span class="tag">background removed</span>
  <p class="note"><b>The two spots that give a cutout away:</b> the gap inside the handle, and a coloured fringe along the edge. Both fixed here.</p></div>
