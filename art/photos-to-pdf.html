<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<!-- blog-photos-to-pdf: three phone photos of paperwork on the left, the tidy PDF on the right. -->
<style>
  .left{position:absolute;left:0;top:0;bottom:0;width:640px}
  .ph{position:absolute;width:330px;height:220px;border-radius:8px;overflow:hidden;border:6px solid #f4f1ea;box-shadow:0 16px 30px rgba(0,0,0,.5)}
  .ph img{width:100%;height:100%;object-fit:cover}
  .p1{left:40px;top:70px;transform:rotate(-8deg)} .p2{left:250px;top:190px;transform:rotate(6deg)} .p3{left:70px;top:330px;transform:rotate(-3deg)}
  .right{position:absolute;left:700px;right:56px;top:60px}
  h1{font:600 30px/1.15 'Space Grotesk',sans-serif}
  .sub{color:var(--ink2);font-size:17px;margin-top:8px}
  .pdf{margin-top:28px;position:relative;height:300px}
  .page{position:absolute;width:210px;height:282px;background:#f7f7f4;border-radius:4px;box-shadow:0 10px 24px rgba(0,0,0,.45);overflow:hidden}
  .page img{position:absolute;inset:18px;width:calc(100% - 36px);height:60%;object-fit:cover;filter:grayscale(.2) contrast(1.05)}
  .page i{position:absolute;left:18px;right:18px;height:6px;border-radius:3px;background:#d9dbe0}
  .pg1{left:0;top:18px}.pg2{left:26px;top:9px}.pg3{left:52px;top:0}
  .meta{position:absolute;left:300px;top:40px;font:500 17px/1.8 'JetBrains Mono',monospace;color:var(--ink2)}
  .meta b{color:var(--ink1);font-weight:600}
  .credit{left:16px;right:auto}
</style>
<div class="left">
  <div class="ph p1"><img src="assets/receipt-1.jpg" alt=""></div>
  <div class="ph p2"><img src="assets/receipt-2.jpg" alt=""></div>
  <div class="ph p3"><img src="assets/receipt-3.jpg" alt=""></div>
  <span class="credit">Photos: Kaboompics / Pexels</span>
</div>
<div class="right">
  <h1>Twelve crooked photos, or one clean PDF</h1>
  <p class="sub">Straightened, in order, one file.</p>
  <div class="pdf">
    <div class="page pg1"><img src="assets/receipt-3.jpg" alt=""><i style="top:190px"></i><i style="top:206px;right:60px"></i></div>
    <div class="page pg2"><img src="assets/receipt-2.jpg" alt=""><i style="top:190px"></i><i style="top:206px;right:80px"></i></div>
    <div class="page pg3"><img src="assets/receipt-1.jpg" alt=""><i style="top:190px"></i><i style="top:206px;right:50px"></i><i style="top:222px;right:110px"></i></div>
    <div class="meta"><b>expenses.pdf</b><br>3 pages<br>in the order taken</div>
  </div>
</div>
